# This machine's Radeon HDMI device 8 is the Viture Beast (aplay: HDMI 2).
# Pro Audio names it "HDMI 2". The devices widget prefers node.nick.
monitor.alsa.rules = [
  {
    matches = [
      {
        alsa.card = "0"
        alsa.device = "8"
        media.class = "Audio/Sink"
      }
    ]
    actions = {
      update-props = {
        node.nick = "VITURE Beast"
        node.description = "VITURE Beast"
      }
    }
  }
]
